<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문서 만들기</title>
</head>
<body>
<h1>문서 수정</h1>
<form th:action="${updatePath}" method="post">
    <input type="hidden" name="document_id" th:value="${document.getDocumentId()}">
    <div>
        <label for="titleTextInput">제목</label>
        <input type="text" name="document_title" th:value="${document.getDocumentTitle()}" class="form-control" id="titleTextInput" readonly>
    </div>

    <div>
        <label for="contentTextInput" class="form-label">내용</label>
        <textarea name="content" id="contentTextInput" rows="30" cols="50" placeholder="내용을 입력하세요..." th:text="${document.getContent()}"></textarea>
    </div>

    <button type="submit">수정</button>
</form>
</body>
</html>
