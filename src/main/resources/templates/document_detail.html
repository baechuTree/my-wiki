<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${documentTitle}">Not found</title>
</head>
<body>
<header>

</header>
<section>
    <div>
        <h1 th:text="${document.getDocumentTitle()}">페이지 제목</h1>
    </div>
    <div>
        <a href="#" th:href="${updatePagePath}">수정</a>

        <a href="#" onclick="postRequest('delete'); return null;">삭제</a>
        <form id="delete" th:action="${deletePath}" method="post" style="display:none;">
            <input type="hidden" name="document_title" th:value="${documentTitle}">
        </form>
    </div>
    <div th:text="${document.getContent()}">
        페이지 내용
    </div>
</section>
<script>
function postRequest(id) {
    document.getElementById(id).submit();
}
</script>
</body>
</html>
